name: "Validate PR body"

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  validate-pr-body:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check PR body for required sections
        uses: actions/github-script@v6
        with:
          script: |
            const body = (context.payload.pull_request && context.payload.pull_request.body) || "";
            const missing = [];

            if (!/##\s*Summary/i.test(body)) missing.push('Summary (## Summary)');
            if (!/##\s*(Description|Changes Made)/i.test(body)) missing.push('Description / Changes Made (## Description / Changes Made)');
            if (!/(Closes|Fixes|Related to)\s*#\d+/i.test(body)) missing.push("Linked issue (e.g. 'Closes #123')");
            if (!/##\s*How to test/i.test(body)) missing.push('How to test (## How to test)');
            if (!/##\s*Checklist/i.test(body)) missing.push('Checklist (## Checklist)');

            if (missing.length > 0) {
              const comment = `:warning: PR description is missing required section(s):\n\n- ${missing.join('\n- ')}\n\nPlease update the PR description using the template at \.github/PULL_REQUEST_TEMPLATE.md`; 

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });

              core.setFailed(`PR template validation failed — missing: ${missing.join(', ')}`);
            } else {
              console.log('PR body contains required sections.');
            }
