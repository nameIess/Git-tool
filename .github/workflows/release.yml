name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: Generate resource file
        run: goversioninfo -icon=icon.ico -manifest="" -o resource_windows.syso

      - name: Build release executable
        run: go build -ldflags "-s -w" -o git-tool.exe .

      - name: Compute SHA-256 checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "git-tool.exe").Hash
          "git-tool.exe  $hash" | Out-File -Encoding utf8 checksums.txt
          Write-Host "SHA256: $hash"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Git Tool ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            git-tool.exe
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
