name: GUI CI

on:
  push:
    branches: [main, rewrite-gui-production]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.6'
          cache: true
      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Format check
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) { Write-Error 'gofmt required'; exit 1 }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Wails doctor
        run: wails doctor
      - name: Production build
        run: wails build -platform windows/amd64 -webview2 download
