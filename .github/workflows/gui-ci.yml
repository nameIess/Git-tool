name: GUI CI\n\non:\n  push:\n    branches: [main, rewrite-gui-production]\n  pull_request:\n    branches: [main]\n\npermissions:\n  contents: read\n\njobs:\n  windows:\n    runs-on: windows-latest\n    steps:\n      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683\n      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5\n        with:\n          go-version: '1.25.6'\n          cache: true\n      - name: Install Wails\n        shell: pwsh\n        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0\n      - name: Format check\n        shell: pwsh\n        run: |\n          $files = gofmt -l .\n          if ($files) { Write-Error 'gofmt required'; exit 1 }\n      - name: Test\n        run: go test ./...\n      - name: Vet\n        run: go vet ./...\n      - name: Wails doctor\n        run: wails doctor\n      - name: Production build\n        run: wails build -platform windows/amd64 -webview2 download\n